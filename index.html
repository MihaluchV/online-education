<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клас-код — спільна практична робота</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--ac:#4f46e5;--ok:#16a34a;--bd:#e3e6ef}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf2;--mu:#98a1b8;--ac:#818cf8;--bd:#2d3345}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea,select{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%}input:disabled,textarea:disabled{opacity:.7}
.box{max-width:420px;margin:6vh auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.mu{color:var(--mu);font-size:13px}.err{color:#dc2626;font-size:13px;min-height:1em}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{flex:1}.banner{margin:10px 16px;padding:10px 14px;border-radius:10px;background:#eef2ff;color:#312e81;white-space:pre-wrap}
.cm{background:#fef9c3;color:#713f12}.banner.ok{background:#dcfce7;color:#14532d}.banner.rt{background:#ffedd5;color:#7c2d12}
.ws{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px;height:calc(100vh - 170px);min-height:420px}
@media(max-width:800px){.ws{grid-template-columns:1fr;height:auto}}
.pane{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-height:320px}
.tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd);flex-wrap:wrap;align-items:center}.tabs button{padding:5px 12px}
textarea.code{flex:1;border:0;border-radius:0;font:13px/1.5 ui-monospace,Menlo,monospace;resize:none;tab-size:2;white-space:pre}
iframe{border:0;background:#fff;width:100%;flex:1}
.con{max-height:130px;overflow:auto;background:#0f1320;color:#cbd5e1;font:12px ui-monospace,monospace;padding:6px 10px}.con .error{color:#fca5a5}.con .warn{color:#fcd34d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 16px 16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}.st.sub{border-color:#f59e0b;box-shadow:0 0 0 2px #f59e0b55}
.st h4{margin:0;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex:none}.dot.o{background:var(--ok)}
.th{width:250px;height:170px;overflow:hidden;position:relative;border-top:1px solid var(--bd)}.th iframe{width:833px;height:567px;transform:scale(.3);transform-origin:0 0;position:absolute;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;padding:3vh 3vw;z-index:9}.modal>div{flex:1;display:flex;flex-direction:column;background:var(--bg);border-radius:14px;overflow:hidden}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px}.cnt{background:rgba(127,127,127,.28);border-radius:10px;padding:0 8px;margin-left:7px;font-size:12px}
.bd{font-size:12px;padding:1px 7px;border-radius:8px;white-space:nowrap}.bd.s{background:#fde68a;color:#78350f}.bd.k{background:#bbf7d0;color:#14532d}.bd.r{background:#fecaca;color:#7f1d1d}
.toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:20;max-width:90vw}.toast{background:#1f2937;color:#fff;padding:12px 16px;border-radius:10px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.tp{padding:12px 16px;display:grid;gap:8px}.code5{font:700 26px ui-monospace,monospace;letter-spacing:4px;flex:2}
.edh{flex:1;min-height:0;position:relative}.edh textarea{position:absolute;inset:0;height:100%;width:100%}
.CodeMirror{position:absolute;inset:0;height:auto;background:var(--card);color:var(--tx);font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}
.CodeMirror-gutters{background:var(--bg);border-right:1px solid var(--bd)}.CodeMirror-linenumber{color:var(--mu)}.CodeMirror-cursor{border-left:1.5px solid var(--tx)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:rgba(99,102,241,.28)}.CodeMirror-matchingbracket{color:inherit!important;background:rgba(99,102,241,.35)}
.cm-s-default .cm-tag{color:#db2777}.cm-s-default .cm-attribute{color:#d97706}.cm-s-default .cm-string{color:#16a34a}.cm-s-default .cm-keyword{color:#8b5cf6}
.cm-s-default .cm-comment{color:#94a3b8}.cm-s-default .cm-number{color:#3b82f6}.cm-s-default .cm-def,.cm-s-default .cm-variable-2{color:#0891b2}
.cm-s-default .cm-bracket,.cm-s-default .cm-meta{color:var(--mu)}.cm-s-default .cm-atom,.cm-s-default .cm-builtin{color:#0ea5e9}

.bd.c{background:#bfdbfe;color:#1e3a8a}
.chatbox{display:flex;flex-direction:column;flex:1;min-height:0}.msgs{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:88%;padding:7px 10px;border-radius:12px;background:var(--bg);white-space:pre-wrap;word-break:break-word}.msg.ot{align-self:flex-start}
.msg.me{align-self:flex-end;background:var(--ac);color:#fff}.msg.me .mu{color:rgba(255,255,255,.75)}
.chatwin{position:fixed;right:16px;bottom:16px;width:min(340px,calc(100vw - 32px));height:420px;max-height:70vh;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:15;overflow:hidden}
.ws.c3{grid-template-columns:1fr 1fr 300px}
@media(max-width:1000px){.ws.c3{grid-template-columns:1fr 1fr}.ws.c3>.chatpane{grid-column:1/-1;min-height:260px}}
@media(max-width:800px){.ws.c3{grid-template-columns:1fr}}

.jw{flex:1;overflow:auto;padding:0 16px 16px}.jx{overflow:auto}.jh{margin:16px 0 6px}
.jt{border-collapse:collapse;width:100%;background:var(--card)}.jt th,.jt td{border:1px solid var(--bd);padding:6px 10px;text-align:left;vertical-align:top}
.jt th{background:var(--bg);white-space:nowrap}.jg{text-align:center;font-weight:600}.jg .mu{font-weight:400;font-size:11px}

.tmr{font-variant-numeric:tabular-nums;font-size:16px}.tmr.low{color:#dc2626}

.st.hlp{border-color:#eab308;box-shadow:0 0 0 3px #eab30866}.bd.h{background:#fef08a;color:#713f12}

.banner button{margin-left:8px;padding:4px 10px}

.st.lk{border-color:#ef4444;box-shadow:0 0 0 3px #ef444455}.bd.a{background:#fed7aa;color:#7c2d12}

.tbar{align-items:center}.tbar b{white-space:nowrap;line-height:1}.tbar select,.tbar button{height:40px;padding-top:0;padding-bottom:0}

.qrb{flex:none;margin:auto;width:min(460px,94vw);max-height:94vh;overflow:auto;background:var(--bg);border-radius:14px}
.qrw{background:#fff;padding:12px;border-radius:12px;width:min(340px,78vw,56vh)}.qrw svg{width:100%;height:auto;display:block}

.pyc{display:flex;flex-direction:column;flex:1;min-height:0}.pyo{flex:1;min-height:80px;overflow:auto;margin:0;padding:10px;background:#0f1320;color:#e2e8f0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
.pyin{background:transparent;border:0;border-bottom:1px solid #64748b;border-radius:0;color:#fff;font:inherit;width:50%;min-width:120px;padding:0 2px;outline:0}
.pys{padding:6px 10px;font-size:13px;color:var(--mu);border-top:1px solid var(--bd)}
.thp{position:absolute;inset:0;margin:0;padding:6px 8px;font:11px/1.35 ui-monospace,Menlo,monospace;overflow:hidden;white-space:pre-wrap;background:#0f1320;color:#cbd5e1}
.thp2{margin:0;max-height:30%;overflow:auto;padding:8px 10px;background:#0f1320;color:#cbd5e1;font:12px/1.4 ui-monospace,Menlo,monospace;white-space:pre-wrap}

.pyg{position:relative;flex:3 1 0;min-height:220px;border-bottom:1px solid var(--bd);background:#e5e7eb}
</style></head><body><div id="app"></div>

 версії Python.'\\n    return ''\\n\\ndef _format_error(e, files, libs, use_tk=False):\\n    lines = []\\n    if isinstance(e, SyntaxError):\\n        lines.append('Помилка синтаксису у файлі ' + _short(e.filename or 'main.py') + ', рядок ' + str(e.lineno) + ':')\\n        if e.text:\\n            lines.append('    ' + e.text.rstrip('\\\\n'))\\n            if e.offset:\\n                lines.append('    ' + ' ' * max(0, e.offset - 1) + '^')\\n        lines.append(type(e).__name__ + ': ' + str(e.msg))\\n        return '\\\\n'.join(lines)\\n    frames = [f for f in traceback.extract_tb(e.__traceback__) if _short(f.filename) in files]\\n    lines.append('Помилка під час виконання:')\\n    for f in frames:\\n        lines.append('  Файл \\\"' + _short(f.filename) + '\\\", рядок ' + str(f.lineno) + ', у ' + f.name)\\n        if f.line:\\n            lines.append('    ' + f.line.strip())\\n    lines.append(''.join(traceback.format_exception_only(type(e), e)).rstrip('\\\\n'))\\n    h = _hint(e, libs, use_tk)\\n    if h:\\n        lines.append(h)\\n    return '\\\\n'.join(lines)\\n\\ndef _post_js(obj):\\n    import js\\n    from pyodide.ffi import to_js\\n    js.parent.postMessage(to_js(obj, dict_converter=js.Object.fromEntries), '*')\\n\\ndef _ensure_tk():\\n    if _TK['ns'] is None:\\n        ns = {'__name__': '_tkshim'}\\n        exec(compile(TK_SOURCE, '_tkshim', 'exec'), ns)\\n        _TK['ns'] = ns\\n        _TK['mods'] = ns['_build_modules']()\\n    return _TK\\n\\ndef _tk_off():\\n    for name in ('tkinter', 'tkinter.messagebox', 'tkinter.simpledialog', 'tkinter.ttk', 'tkinter.font', 'tkinter.constants'):\\n        sys.modules.pop(name, None)\\n    if _TK['ns'] is not None:\\n        try:\\n            _TK['ns']['_reset']()\\n        except Exception:\\n            pass\\n\\ndef run_program(files_json, inputs_json, seed, limit, main, libs_json, opts_json='{}'):\\n    files = json.loads(files_json)\\n    inputs = json.loads(inputs_json)\\n    libs = json.loads(libs_json)\\n    opts = json.loads(opts_json or '{}')\\n    use_tk = bool(opts.get('tk'))\\n    home = os.getcwd()\\n    # чиста «файлова система» для кожного запуску: лише файли учня\\n    for entry in os.listdir(home):\\n        if entry not in files:\\n            p = os.path.join(home, entry)\\n            try:\\n                shutil.rmtree(p) if os.path.isdir(p) else os.remove(p)\\n            except OSError:\\n                pass\\n    for name, text in files.items():\\n        with open(os.path.join(home, name), 'w', encoding='utf-8', newline='') as fh:\\n            fh.write(text)\\n    if home not in sys.path:\\n        sys.path.insert(0, home)\\n    mods = [n[:-3] for n in files if n.endswith('.py') and n != main]\\n    for m in mods:\\n        sys.modules.pop(m, None)\\n    importlib.invalidate_caches()\\n\\n    random.seed(seed)\\n    if 'numpy' in libs:\\n        import numpy\\n        numpy.random.seed(int(seed) % (2 ** 32))\\n\\n    out = io.StringIO()\\n    st = {'i': 0, 'need': None, 'cut': 0}\\n    _RUN['t0'] = time.monotonic()\\n    _RUN['limit'] = float(limit)\\n\\n    if use_tk:\\n        tk = _ensure_tk()\\n        tk['ns']['_reset']()\\n        sys.modules.update(tk['mods'])\\n\\n        def _emit(text):\\n            _post_js({'k': 'py', 't': 'append', 'm': text})\\n\\n        def _fmt(e):\\n            if isinstance(e, _TimeUp):\\n                return '⏱ Обробник події виконувався довше ' + str(int(_RUN['limit'])) + ' с і був зупинений. Перевірте цикли.'\\n            return _format_error(e, files, libs, True)\\n\\n        def _rearm():\\n            _RUN['t0'] = time.monotonic()\\n        tk['ns']['_install'](_emit, _fmt, _rearm)\\n    else:\\n        _tk_off()\\n\\n    def _input(prompt=''):\\n        p = str(prompt)\\n        out.write(p)\\n        if st['i'] < len(inputs):\\n            v = inputs[st['i']]\\n            st['i'] += 1\\n            out.write(v + '\\\\n')\\n            return v\\n        st['need'] = p\\n        st['cut'] = out.tell()\\n        raise _NeedInput()\\n\\n    def _tick():\\n        if time.monotonic() - _RUN['t0'] > _RUN['limit']:\\n            raise _TimeUp()\\n\\n    old = (sys.stdout, sys.stderr, builtins.input)\\n    sys.stdout = out\\n    sys.stderr = out\\n    builtins.input = _input\\n    err = False\\n    try:\\n        try:\\n            tree = ast.parse(files[main], main)\\n            tree = ast.fix_missing_locations(_Loops().visit(tree))\\n            code = compile(tree, main, 'exec')\\n            g = {'__name__': '__main__', '__file__': main, '__tick__': _tick}\\n            exec(code, g)\\n        except _NeedInput:\\n            pass\\n        except SystemExit:\\n            pass\\n        except _TimeUp as e:\\n            err = True\\n            frames = [f for f in traceback.extract_tb(e.__traceback__) if _short(f.filename) in files]\\n            where = (' (рядок ' + str(frames[-1].lineno) + ')') if frames else ''\\n            out.write('\\\\n⏱ Програма виконувалася довше ' + str(int(limit)) + ' с і була зупинена' + where + '. Перевірте цикли while/for.')\\n        except BaseException as e:\\n            err = True\\n            if out.tell() and not out.getvalue().endswith('\\\\n'):\\n                out.write('\\\\n')\\n            out.write(_format_error(e, files, libs, use_tk))\\n    finally:\\n        sys.stdout, sys.stderr, builtins.input = old\\n    text = out.getvalue()\\n    if st['need'] is not None:\\n        err = False\\n        text = text[:st['cut']]\\n    if len(text) > 200000:\\n        text = text[:200000] + '\\\\n… (вивід обрізано)'\\n    gui = False\\n    if use_tk:\\n        try:\\n            _TK['ns']['_flush']()\\n            gui = bool(_TK['ns']['_active']())\\n        except BaseException as e:\\n            text += '\\\\n(помилка інтерфейсу: ' + str(e) + ')'\\n    return json.dumps({'out': text, 'need': st['need'], 'err': err, 'gui': gui})\\n\\n\\nTK_SOURCE = '# tkinter для браузера: невеликий сумісний шар на DOM (працює в Pyodide всередині ізольованого iframe).\\\\n# Підтримує типові шкільні програми. Не блокуючий mainloop: після завершення програми вікно живе, а обробники подій викликаються з браузера.\\\\nimport sys, time, math, json, itertools, re, types\\\\nimport js\\\\nfrom pyodide.ffi import create_proxy, to_js\\\\n\\\\n_inj = {}\\\\n_ids = itertools.count(1)\\\\n_keep = []\\\\n_timers = {}\\\\n_by_id = {}\\\\n_windows = []\\\\n_default_root = None\\\\n_dirty = set()\\\\n_dirty_canvas = set()\\\\n_global_binds = []\\\\n_style_added = False\\\\n\\\\ndef _install(emit, fmt, rearm):\\\\n    _inj.update(emit=emit, fmt=fmt, rearm=rearm)\\\\n\\\\nclass TclError(Exception):\\\\n    pass\\\\n\\\\n# ---------- константи ----------\\\\nN, S, E, W = \\\\'n\\\\', \\\\'s\\\\', \\\\'e\\\\', \\\\'w\\\\'\\\\nNW, NE, SW, SE = \\\\'nw\\\\', \\\\'ne\\\\', \\\\'sw\\\\', \\\\'se\\\\'\\\\nNS, EW, NSEW, CENTER = \\\\'ns\\\\', \\\\'ew\\\\', \\\\'nsew\\\\', \\\\'center\\\\'\\\\nTOP, BOTTOM, LEFT, RIGHT = \\\\'top\\\\', \\\\'bottom\\\\', \\\\'left\\\\', \\\\'right\\\\'\\\\nBOTH, X, Y, NONE = \\\\'both\\\\', \\\\'x\\\\', \\\\'y\\\\', \\\\'none\\\\'\\\\nEND, INSERT, ANCHOR, ACTIVE, ALL, CURRENT, SEL = \\\\'end\\\\', \\\\'insert\\\\', \\\\'anchor\\\\', \\\\'active\\\\', \\\\'all\\\\', \\\\'current\\\\', \\\\'sel\\\\'\\\\nNORMAL, DISABLED, HIDDEN, READONLY = \\\\'normal\\\\', \\\\'disabled\\\\', \\\\'hidden\\\\', \\\\'readonly\\\\'\\\\nHORIZONTAL, VERTICAL = \\\\'horizontal\\\\', \\\\'vertical\\\\'\\\\nFLAT, RAISED, SUNKEN, GROOVE, RIDGE, SOLID = \\\\'flat\\\\', \\\\'raised\\\\', \\\\'sunken\\\\', \\\\'groove\\\\', \\\\'ridge\\\\', \\\\'solid\\\\'\\\\nWORD, CHAR = \\\\'word\\\\', \\\\'char\\\\'\\\\nSINGLE, BROWSE, MULTIPLE, EXTENDED = \\\\'single\\\\', \\\\'browse\\\\', \\\\'multiple\\\\', \\\\'extended\\\\'\\\\nFIRST, LAST, BUTT, ROUND, PROJECTING = \\\\'first\\\\', \\\\'last\\\\', \\\\'butt\\\\', \\\\'round\\\\', \\\\'projecting\\\\'\\\\nPIESLICE, CHORD, ARC = \\\\'pieslice\\\\', \\\\'chord\\\\', \\\\'arc\\\\'\\\\nYES, NO, TRUE, FALSE, ON, OFF = 1, 0, True, False, 1, 0\\\\nTkVersion = 8.6\\\\n\\\\n# ---------- допоміжні функції DOM ----------\\\\ndef _el(tag, cls=None):\\\\n    e = js.document.createElement(tag)\\\\n    if cls:\\\\n        e.className = cls\\\\n    return e\\\\n\\\\ndef _st(e, **kw):\\\\n    s = e.style\\\\n    for k, v in kw.items():\\\\n        s.setProperty(k.replace(\\\\'_\\\\', \\\\'-\\\\'), str(v))\\\\n\\\\ndef _cb(fn):\\\\n    p = create_proxy(fn)\\\\n    _keep.append(p)\\\\n    return p\\\\n\\\\ndef _on(e, typ, fn):\\\\n    e.addEventListener(typ, _cb(fn))\\\\n\\\\ndef _clear(e):\\\\n    while e.firstChild:\\\\n        e.removeChild(e.firstChild)\\\\n\\\\ndef _post(obj):\\\\n    try:\\\\n        js.parent.postMessage(to_js(obj, dict_converter=js.Object.fromEntries), \\\\'*\\\\')\\\\n    except Exception:\\\\n        pass\\\\n\\\\ndef _px(v):\\\\n    try:\\\\n        return str(int(float(v))) + \\\\'px\\\\'\\\\n    except Exception:\\\\n        return str(v)\\\\n\\\\ndef _pad(v):\\\\n    if isinstance(v, (tuple, list)):\\\\n        return _px(v[0]), _px(v[1] if len(v) > 1 else v[0])\\\\n    return _px(v), _px(v)\\\\n\\\\ndef _color(c):\\\\n    if c is None or c == \\\\'\\\\':\\\\n        return None\\\\n    c = str(c)\\\\n    if c.startswith(\\\\'#\\\\') and len(c) in (13, 10):   # #rrrrggggbbbb -> #rrggbb\\\\n        n = (len(c) - 1) // 3\\\\n        return \\\\'#\\\\' + c[1:3] + c[1 + n:3 + n] + c[1 + 2 * n:3 + 2 * n]\\\\n    return c.replace(\\\\' \\\\', \\\\'\\\\') if c.lower().startswith(\\\\'system\\\\') is False and \\\\' \\\\' in c else c\\\\n\\\\ndef _font(f):\\\\n    \\\"\\\"\\\"Повертає словник CSS для шрифту Tk: (\\\\'Arial\\\\', 14, \\\\'bold\\\\') або \\\\'Arial 14 bold\\\\' або Font().\\\"\\\"\\\"\\\\n    if f is None:\\\\n        return {}\\\\n    if isinstance(f, Font):\\\\n        f = (f.family, f.size, f.weight)\\\\n    fam, size, extra = None, None, []\\\\n    if isinstance(f, (tuple, list)):\\\\n        parts = list(f)\\\\n        fam = parts[0] if parts else None\\\\n        if len(parts) > 1:\\\\n            size = parts[1]\\\\n        if len(parts) > 2:\\\\n            extra = \\\\' \\\\'.join(str(x) for x in parts[2:]).split()\\\\n    else:\\\\n        toks = str(f).replace(\\\\'{\\\\', \\\\'\\\\').replace(\\\\'}\\\\', \\\\'\\\\').split()\\\\n        for t in toks:\\\\n            if re.fullmatch(r\\\\'-?\\\\\\\\d+\\\\', t) and size is None:\\\\n                size = t\\\\n            elif t in (\\\\'bold\\\\', \\\\'italic\\\\', \\\\'underline\\\\', \\\\'roman\\\\', \\\\'normal\\\\', \\\\'overstrike\\\\'):\\\\n                extra.append(t)\\\\n            elif fam is None:\\\\n                fam = t\\\\n            else:\\\\n                fam += \\\\' \\\\' + t\\\\n    d = {}\\\\n    if fam:\\\\n        d[\\\\'font-family\\\\'] = \\\\'\\\"%s\\\", sans-serif\\\\' % fam\\\\n    if size is not None:\\\\n        try:\\\\n            n = int(size)\\\\n            d[\\\\'font-size\\\\'] = (str(abs(n)) + \\\\'px\\\\') if n < 0 else (str(round(n * 4 / 3, 1)) + \\\\'px\\\\')\\\\n        except Exception:\\\\n            pass\\\\n    d[\\\\'font-weight\\\\'] = \\\\'bold\\\\' if \\\\'bold\\\\' in extra else \\\\'normal\\\\'\\\\n    d[\\\\'font-style\\\\'] = \\\\'italic\\\\' if \\\\'italic\\\\' in extra else \\\\'normal\\\\'\\\\n    d[\\\\'text-decoration\\\\'] = \\\\'underline\\\\' if \\\\'underline\\\\' in extra else (\\\\'line-through\\\\' if \\\\'overstrike\\\\' in extra else \\\\'none\\\\')\\\\n    return d\\\\n\\\\nclass Font:\\\\n    def __init__(self, root=None, font=None, name=None, exists=False, **kw):\\\\n        self.family = kw.get(\\\\'family\\\\', \\\\'Arial\\\\')\\\\n        self.size = kw.get(\\\\'size\\\\', 10)\\\\n        self.weight = kw.get(\\\\'weight\\\\', \\\\'normal\\\\')\\\\n    def configure(self, **kw):\\\\n        self.family = kw.get(\\\\'family\\\\', self.family); self.size = kw.get(\\\\'size\\\\', self.size); self.weight = kw.get(\\\\'weight\\\\', self.weight)\\\\n    config = configure\\\\n    def cget(self, k):\\\\n        return getattr(self, k)\\\\n    def measure(self, text):\\\\n        return int(len(str(text)) * float(self.size) * 0.62 + 2)\\\\n    def metrics(self, *a):\\\\n        return int(float(self.size) * 1.3) if a else {\\\\'linespace\\\\': int(float(self.size) * 1.3), \\\\'ascent\\\\': int(float(self.size)), \\\\'descent\\\\': 3, \\\\'fixed\\\\': 0}\\\\n\\\\n# ---------- стилі ----------\\\\n_CSS = \\\"\\\"\\\"\\\\n.tkw{display:inline-block;margin:8px;border:1px solid #7a7a7a;background:#f0f0f0;font:12px/1.3 \\\"Segoe UI\\\",Tahoma,Arial,sans-serif;color:#000;box-shadow:2px 3px 10px rgba(0,0,0,.35);vertical-align:top;position:relative}\\\\n.tkt{display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #aaa;padding:3px 4px 3px 8px;font-size:12px;user-select:none;white-space:nowrap}\\\\n.tkx{cursor:pointer;padding:0 8px;color:#444}.tkx:hover{background:#e81123;color:#fff}\\\\n.tkc{position:relative;background:#f0f0f0;box-sizing:border-box;min-width:90px;min-height:28px}\\\\n.tkb{font:inherit;background:#e1e1e1;border:1px solid #adadad;padding:3px 10px;color:#000;cursor:default}.tkb:hover{background:#e5f1fb;border-color:#0078d7}.tkb:active{background:#cce4f7}.tkb:disabled{color:#888;background:#ccc}\\\\n.tkl{display:inline-block;box-sizing:border-box;padding:1px 2px;white-space:pre-wrap}\\\\n.tke,.tkt2{font:inherit;box-sizing:content-box;border:2px inset #ccc;background:#fff;color:#000;padding:1px 2px}\\\\n.tkt2{resize:none;overflow:auto;white-space:pre-wrap;display:block}\\\\n.tklf{border:2px groove #bbb;padding:4px;position:relative;margin-top:6px}.tklf>.tklg{position:absolute;top:-9px;left:8px;background:#f0f0f0;padding:0 3px}\\\\n.tkcv{display:block;box-sizing:content-box}\\\\n.tkck,.tkrb{display:inline-flex;align-items:center;gap:4px}\\\\n.tksc{display:inline-flex;align-items:center;gap:6px}\\\\n.tkw select,.tkw input[type=range]{font:inherit}\\\\n\\\"\\\"\\\"\\\\n\\\\ndef _ensure_style():\\\\n    global _style_added\\\\n    if _style_added:\\\\n        return\\\\n    st = _el(\\\\'style\\\\')\\\\n    st.textContent = _CSS\\\\n    js.document.head.appendChild(st)\\\\n    _style_added = True\\\\n\\\\n# ---------- зміні ----------\\\\nclass Variable:\\\\n    _default = \\\\'\\\\'\\\\n    def __init__(self, master=None, value=None, name=None):\\\\n        self._value = self._default if value is None else value\\\\n        self._subs = []\\\\n        self._traces = []\\\\n    def get(self):\\\\n        return self._value\\\\n    def set(self, v):\\\\n        self._value = self._conv(v)\\\\n        for f in list(self._subs):\\\\n            f()\\\\n        for cb in list(self._traces):\\\\n            _call(cb, \\\\'\\\\', \\\\'\\\\', \\\\'write\\\\')\\\\n    def _conv(self, v):\\\\n        return v\\\\n    def trace_add(self, mode, cb):\\\\n        self._traces.append(cb); return str(id(cb))\\\\n    trace = trace_variable = lambda self, mode, cb: self.trace_add(mode, cb)\\\\n    def trace_remove(self, mode, cbname):\\\\n        pass\\\\n    initialize = set\\\\n\\\\nclass StringVar(Variable):\\\\n    _default = \\\\'\\\\'\\\\n    def _conv(self, v):\\\\n        return str(v)\\\\n\\\\nclass IntVar(Variable):\\\\n    _default = 0\\\\n    def _conv(self, v):\\\\n        try:\\\\n            return int(float(v))\\\\n        except Exception:\\\\n            raise TclError(\\\\'expected integer but got \\\"%s\\\"\\\\' % (v,))\\\\n\\\\nclass DoubleVar(Variable):\\\\n    _default = 0.0\\\\n    def _conv(self, v):\\\\n        try:\\\\n            return float(v)\\\\n        except Exception:\\\\n            raise TclError(\\\\'expected floating-point number but got \\\"%s\\\"\\\\' % (v,))\\\\n\\\\nclass BooleanVar(Variable):\\\\n    _default = False\\\\n    def _conv(self, v):\\\\n        return bool(v) if not isinstance(v, str) else v.lower() in (\\\\'1\\\\', \\\\'true\\\\', \\\\'yes\\\\', \\\\'on\\\\')\\\\n\\\\n# ---------- виклики з браузера ----------\\\\nclass _Writer:\\\\n    def write(self, s):\\\\n        if s:\\\\n            _inj[\\\\'emit\\\\'](str(s))\\\\n        return len(s) if s else 0\\\\n    def flush(self):\\\\n        pass\\\\n\\\\ndef _call(fn, *args):\\\\n    _inj[\\\\'rearm\\\\']()\\\\n    old = (sys.stdout, sys.stderr)\\\\n    sys.stdout = sys.stderr = _Writer()\\\\n    try:\\\\n        return fn(*args)\\\\n    except SystemExit:\\\\n        _destroy_all()\\\\n    except BaseException as e:\\\\n        try:\\\\n            _inj[\\\\'emit\\\\'](\\\\'\\\\\\\\n\\\\' + _inj[\\\\'fmt\\\\'](e) + \\\\'\\\\\\\\n\\\\')\\\\n        except Exception:\\\\n            pass\\\\n    finally:\\\\n        sys.stdout, sys.stderr = old\\\\n        try:\\\\n            _flush()\\\\n        except Exception:\\\\n            pass\\\\n\\\\ndef _after(ms, fn, *args):\\\\n    tid = \\\\'after#\\\\' + str(next(_ids))\\\\n    def run():\\\\n        _timers.pop(tid, None)\\\\n        _call(fn, *args)\\\\n    p = create_proxy(run)\\\\n    jid = js.setTimeout(p, max(0, int(ms)))\\\\n    _timers[tid] = (jid, p)\\\\n    return tid\\\\n\\\\ndef _after_cancel(tid):\\\\n    t = _timers.pop(tid, None)\\\\n    if t:\\\\n        js.clearTimeout(t[0])\\\\n\\\\n# ---------- події ----------\\\\nclass Event:\\\\n    def __init__(self, **kw):\\\\n        self.x = self.y = self.x_root = self.y_root = 0\\\\n        self.char = \\\\'\\\\'; self.keysym = \\\\'\\\\'; self.keycode = 0; self.num = 0; self.delta = 0\\\\n        self.widget = None; self.state = 0; self.width = self.height = 0; self.type = \\\\'\\\\'\\\\n        self.__dict__.update(kw)\\\\n    def __repr__(self):\\\\n        return \\\\'<Event %s x=%s y=%s>\\\\' % (self.type, self.x, self.y)\\\\n\\\\n_KEYSYM = {\\\\' \\\\': \\\\'space\\\\', \\\\'Enter\\\\': \\\\'Return\\\\', \\\\'ArrowUp\\\\': \\\\'Up\\\\', \\\\'ArrowDown\\\\': \\\\'Down\\\\', \\\\'ArrowLeft\\\\': \\\\'Left\\\\', \\\\'ArrowRight\\\\': \\\\'Right\\\\',\\\\n           \\\\'Backspace\\\\': \\\\'BackSpace\\\\', \\\\'Delete\\\\': \\\\'Delete\\\\', \\\\'Escape\\\\': \\\\'Escape\\\\', \\\\'Tab\\\\': \\\\'Tab\\\\', \\\\'Home\\\\': \\\\'Home\\\\', \\\\'End\\\\': \\\\'End\\\\',\\\\n           \\\\'PageUp\\\\': \\\\'Prior\\\\', \\\\'PageDown\\\\': \\\\'Next\\\\', \\\\'Insert\\\\': \\\\'Insert\\\\', \\\\'+\\\\': \\\\'plus\\\\', \\\\'-\\\\': \\\\'minus\\\\', \\\\'*\\\\': \\\\'asterisk\\\\', \\\\'/\\\\': \\\\'slash\\\\',\\\\n           \\\\'.\\\\': \\\\'period\\\\', \\\\',\\\\': \\\\'comma\\\\', \\\\';\\\\': \\\\'semicolon\\\\', \\\\'=\\\\': \\\\'equal\\\\'}\\\\n\\\\ndef _parse_seq(seq):\\\\n    s = str(seq).strip()\\\\n    if s.startswith(\\\\'<<\\\\'):\\\\n        return {\\\\'virtual\\\\': s.strip(\\\\'<>\\\\')}\\\\n    parts = s.strip(\\\\'<>\\\\').split(\\\\'-\\\\')\\\\n    mods = [p for p in parts if p in (\\\\'Control\\\\', \\\\'Shift\\\\', \\\\'Alt\\\\', \\\\'Double\\\\', \\\\'Triple\\\\', \\\\'Any\\\\', \\\\'Mod1\\\\', \\\\'Command\\\\')]\\\\n    rest = [p for p in parts if p not in mods]\\\\n    d = {\\\\'mods\\\\': mods, \\\\'seq\\\\': s}\\\\n    head = rest[0] if rest else \\\\'\\\\'\\\\n    if head in (\\\\'Button\\\\', \\\\'ButtonPress\\\\') or (head.isdigit() and len(rest) == 1):\\\\n        d.update(kind=\\\\'mousedown\\\\', btn=int(rest[-1]) if rest[-1].isdigit() else 1)\\\\n    elif head == \\\\'ButtonRelease\\\\':\\\\n        d.update(kind=\\\\'mouseup\\\\', btn=int(rest[-1]) if rest[-1].isdigit() else 1)\\\\n    elif re.fullmatch(r\\\\'B\\\\\\\\d\\\\', head):\\\\n        d.update(kind=\\\\'mousemove\\\\', held=int(head[1]))\\\\n    elif head == \\\\'Motion\\\\':\\\\n        d.update(kind=\\\\'mousemove\\\\')\\\\n    elif head in (\\\\'Enter\\\\', \\\\'Leave\\\\', \\\\'FocusIn\\\\', \\\\'FocusOut\\\\', \\\\'Destroy\\\\', \\\\'Configure\\\\', \\\\'Map\\\\', \\\\'Unmap\\\\', \\\\'Visibility\\\\'):\\\\n        d.update(kind=head.lower())\\\\n    elif head == \\\\'MouseWheel\\\\':\\\\n        d.update(kind=\\\\'wheel\\\\')\\\\n    elif head in (\\\\'Key\\\\', \\\\'KeyPress\\\\', \\\\'KeyRelease\\\\'):\\\\n        key = rest[1] if len(rest) > 1 else None\\\\n        d.update(kind=\\\\'keyup\\\\' if head == \\\\'KeyRelease\\\\' else \\\\'keydown\\\\', key=key)\\\\n    else:\\\\n        d.update(kind=\\\\'keydown\\\\', key=head)\\\\n    if \\\\'Double\\\\' in mods and d.get(\\\\'kind\\\\') == \\\\'mousedown\\\\':\\\\n        d[\\\\'kind\\\\'] = \\\\'dblclick\\\\'\\\\n    return d\\\\n\\\\ndef _dom_event_for(kind):\\\\n    return {\\\\'mousedown\\\\': \\\\'mousedown\\\\', \\\\'mouseup\\\\': \\\\'mouseup\\\\', \\\\'mousemove\\\\': \\\\'mousemove\\\\', \\\\'enter\\\\': \\\\'mouseenter\\\\', \\\\'leave\\\\': \\\\'mouseleave\\\\',\\\\n            \\\\'focusin\\\\': \\\\'focus\\\\', \\\\'focusout\\\\': \\\\'blur\\\\', \\\\'wheel\\\\': \\\\'wheel\\\\', \\\\'dblclick\\\\': \\\\'dblclick\\\\'}.get(kind)\\\\n\\\\ndef _mkevent(widget, e, kind):\\\\n    r = widget._el.getBoundingClientRect()\\\\n    ev = Event(widget=widget, type=kind)\\\\n    try:\\\\n        if kind in (\\\\'mousedown\\\\', \\\\'mouseup\\\\', \\\\'mousemove\\\\', \\\\'enter\\\\', \\\\'leave\\\\', \\\\'wheel\\\\', \\\\'dblclick\\\\'):\\\\n            ev.x = int(e.clientX - r.left); ev.y = int(e.clientY - r.top)\\\\n            ev.x_root = int(e.screenX); ev.y_root = int(e.screenY)\\\\n            ev.num = int(e.button) + 1 if kind in (\\\\'mousedown\\\\', \\\\'mouseup\\\\', \\\\'dblclick\\\\') else 0\\\\n            if kind == \\\\'wheel\\\\':\\\\n                ev.delta = -int(e.deltaY)\\\\n    except Exception:\\\\n        pass\\\\n    return ev\\\\n\\\\ndef _mods_ok(mods, e):\\\\n    try:\\\\n        if \\\\'Control\\\\' in mods and not e.ctrlKey: return False\\\\n        if \\\\'Shift\\\\' in mods and not e.shiftKey: return False\\\\n        if \\\\'Alt\\\\' in mods and not e.altKey: return False\\\\n    except Exception:\\\\n        pass\\\\n    return True\\\\n\\\\ndef _key_info(e):\\\\n    k = str(e.key)\\\\n    ks = _KEYSYM.get(k, k)       if func is None:\\\\n            return\\\\n        spec = _parse_seq(seq); spec[\\\\'funcs\\\\'] = [func]; spec[\\\\'widget\\\\'] = self\\\\n        _global_binds.append(spec)\\\\n        _ensure_key_listener()\\\\n    bind_class = lambda self, cls, seq=None, func=None, add=None: self.bind(seq, func, add)\\\\n    def _wire(self, spec):\\\\n        kind = spec.get(\\\\'kind\\\\')\\\\n        dom = _dom_event_for(kind)\\\\n        if kind in (\\\\'keydown\\\\', \\\\'keyup\\\\'):\\\\n            _ensure_key_listener()\\\\n            return\\\\n        if not dom or not hasattr(self, \\\\'_el\\\\'):\\\\n            return\\\\n        wired = self.__dict__.setdefault(\\\\'_wired\\\\', set())\\\\n        if dom in wired:\\\\n            return\\\\n        wired.add(dom)\\\\n        def handler(e, dom=dom):\\\\n            for b in list(self._binds):\\\\n                k = b.get(\\\\'kind\\\\')\\\\n                if k is None or _dom_event_for(k) != dom:\\\\n                    continue\\\\n                if k in (\\\\'mousedown\\\\', \\\\'mouseup\\\\', \\\\'dblclick\\\\') and int(e.button) + 1 != b.get(\\\\'btn\\\\', 1):\\\\n                    continue\\\\n                if k == \\\\'mousemove\\\\' and b.get(\\\\'held\\\\') and not (int(e.buttons) & (1 << (b[\\\\'held\\\\'] - 1))):\\\\n                    continue\\\\n                if k == \\\\'mousemove\\\\' and not b.get(\\\\'held\\\\') and False:\\\\n                    continue\\\\n                if not _mods_ok(b.get(\\\\'mods\\\\', []), e):\\\\n                    continue\\\\n                ev = _mkevent(self, e, k)\\\\n                for f in b[\\\\'funcs\\\\']:\\\\n                    if _call(f, ev) == \\\\'break\\\\':\\\\n                        break\\\\n        _on(self._el, dom, handler)\\\\n    def _virtual(self, name):\\\\n        ev = Event(widget=self, type=name)\\\\n        for b in list(self._binds):\\\\n            if b.get(\\\\'virtual\\\\') == name:\\\\n                for f in b[\\\\'funcs\\\\']:\\\\n                    _call(f, ev)\\\\n    def event_generate(self, seq, **kw):\\\\n        self._virtual(str(seq).strip(\\\\'<>\\\\'))\\\\n    # --- фокус\\\\n    def focus_set(self):\\\\n        try:\\\\n            self._el.focus()\\\\n        except Exception:\\\\n            pass\\\\n    focus = focus_force = focus_set\\\\n    def update(self):\\\\n        _flush()\\\\n    update_idletasks = update\\\\n    def quit(self):\\\\n        _destroy_all()\\\\n    # --- інформація про розмір\\\\n    def _rect(self):\\\\n        return self._el.getBoundingClientRect()\\\\n    def winfo_width(self): return int(self._rect().width)\\\\n    def winfo_height(self): return int(self._rect().height)\\\\n    winfo_reqwidth = winfo_width\\\\n    winfo_reqheight = winfo_height\\\\n    def winfo_x(self): return int(self._rect().left)\\\\n    def winfo_y(self): return int(self._rect().top)\\\\n    winfo_rootx = winfo_x\\\\n    winfo_rooty = winfo_y\\\\n    def winfo_screenwidth(self): return int(js.window.innerWidth) if hasattr(js, \\\\'window\\\\') else 1024\\\\n    def winfo_screenheight(self): return int(js.window.innerHeight) if hasattr(js, \\\\'window\\\\') else 768\\\\n    def winfo_children(self): return list(self._children)\\\\n    def winfo_exists(self): return 0 if self._dead else 1\\\\n    def winfo_ismapped(self): return 0 if self._dead else 1\\\\n    def winfo_toplevel(self):\\\\n        w = self\\\\n        while not isinstance(w, (Tk, Toplevel)) and getattr(w, \\\\'master\\\\', None) is not None:\\\\n            w = w.master\\\\n        return w\\\\n    def winfo_pointerx(self): return 0\\\\n    def winfo_pointery(self): return 0\\\\n    # --- розкладка контейнерів\\\\n    def columnconfigure(self, index, weight=None, minsize=None, **kw):\\\\n        idxs = index if isinstance(index, (tuple, list)) else [index]\\\\n        for i in idxs:\\\\n            c = self._colcfg.setdefault(int(i), {})\\\\n            if weight is not None: c[\\\\'weight\\\\' nter\\\\')\\\\n    v = \\\\'flex-start\\\\' if \\\\'n\\\\' in a else (\\\\'flex-end\\\\' if \\\\'s\\\\' in a else \\\\'center\\\\')\\\\n    return h, v\\\\n\\\\ndef _build_pack(ws):\\\\n    if not ws:\\\\n        return None\\\\n    w = ws[0]\\\\n    o = w._geo\\\\n    side = o.get(\\\\'side\\\\', TOP)\\\\n    fill = o.get(\\\\'fill\\\\', NONE)\\\\n    expand = o.get(\\\\'expand\\\\', 0)\\\\n    padx, pady = o.get(\\\\'padx\\\\', 0), o.get(\\\\'pady\\\\', 0)\\\\n    wrap = _el(\\\\'div\\\\')\\\\n    _st(wrap, display=\\\\'flex\\\\', flex_direction={\\\\'top\\\\': \\\\'column\\\\', \\\\'bottom\\\\': \\\\'column-reverse\\\\', \\\\'left\\\\': \\\\'row\\\\', \\\\'right\\\\': \\\\'row-reverse\\\\'}.get(side, \\\\'column\\\\'),\\\\n        box_sizing=\\\\'border-box\\\\', min_width=\\\\'0\\\\', min_height=\\\\'0\\\\', width=\\\\'100%\\\\', height=\\\\'100%\\\\')\\\\n    parcel = _el(\\\\'div\\\\')\\\\n    vertical = side in (TOP, BOTTOM)\\\\n    h, v = _anchor_flex(o.get(\\\\'anchor\\\\', CENTER))\\\\n    _st(parcel, display=\\\\'flex\\\\', box_sizing=\\\\'border-box\\\\', min_width=\\\\'0\\\\', min_height=\\\\'0\\\\')\\\\n    _st(parcel, flex=\\\\'1 0 auto\\\\' if expand else \\\\'0 0 auto\\\\')\\\\n    if vertical:\\\\n        _st(parcel, flex_direction=\\\\'row\\\\', align_self=\\\\'stretch\\\\', justify_content=h, align_items=\\\\'stretch\\\\' if fill in (Y, BOTH) else v)\\\\n    else:\\\\n        _st(parcel, flex_direction=\\\\'column\\\\', align_self=\\\\'stretch\\\\', justify_content=v, align_items=\\\\'stretch\\\\' if fill in (X, BOTH) else h)\\\\n    e = w._el\\\\n    left, right = _pad(padx)\\\\n    top, bottom = _pad(pady)\\\\n    _st(e, margin=\\\\'%s %s %s %s\\\\' % (top, right, bottom, left), position=\\\\'static\\\\', left=\\\\'\\\\', top=\\\\'\\\\', transform=\\\\'\\\\')\\\\n    if vertical:\\\\n        _st(e, flex=\\\\'1 1 auto\\\\' if fill in (X, BOTH) else \\\\'0 0 auto\\\\')\\\\n        if fill in (Y, BOTH): _st(e, align_self=\\\\'stretch\\\\')\\\\n         box.append(el('button',{onclick:go},'Надіслати лист'),el('button',{class:'g',onclick:()=>{mode='in';draw()}},'← Назад до входу'),

      }
