<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Клас-код — спільна практична робота</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#6b7488;--ac:#4f46e5;--ok:#16a34a;--bd:#e3e6ef}
@media(prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1f2b;--tx:#e8eaf2;--mu:#98a1b8;--ac:#818cf8;--bd:#2d3345}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}button.on{background:var(--ac);color:#fff}
input,textarea,select{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;width:100%}
.box{max-width:420px;margin:8vh auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.mu{color:var(--mu);font-size:13px}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{flex:1}.banner{margin:10px 16px;padding:10px 14px;border-radius:10px;background:#eef2ff;color:#312e81;white-space:pre-wrap}
.cm{background:#fef9c3;color:#713f12}.ws{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px;height:calc(100vh - 150px);min-height:420px}
@media(max-width:800px){.ws{grid-template-columns:1fr;height:auto}}
.pane{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-height:320px}
.tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--bd)}.tabs button{padding:5px 12px}
textarea.code{flex:1;border:0;border-radius:0;font:13px/1.5 ui-monospace,Menlo,monospace;resize:none;tab-size:2;white-space:pre}
iframe{border:0;background:#fff;width:100%;flex:1}
.con{max-height:130px;overflow:auto;background:#0f1320;color:#cbd5e1;font:12px ui-monospace,monospace;padding:6px 10px}.con .error{color:#fca5a5}.con .warn{color:#fcd34d}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 16px 16px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;cursor:pointer}
.st h4{margin:0;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}.dot.o{background:var(--ok)}
.th{width:250px;height:170px;overflow:hidden;position:relative;border-top:1px solid var(--bd)}.th iframe{width:833px;height:567px;transform:scale(.3);transform-origin:0 0;position:absolute;pointer-events:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;padding:3vh 3vw;z-index:9}.modal>div{flex:1;display:flex;flex-direction:column;background:var(--bg);border-radius:14px;overflow:hidden}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:4px 16px 12px}.cnt{background:rgba(127,127,127,.28);border-radius:10px;padding:0 8px;margin-left:7px;font-size:12px}
.tp{padding:12px 16px;display:grid;gap:8px}
</style></head><body><div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== 1. ВСТАВТЕ СВІЙ databaseURL З FIREBASE (див. інструкцію) ===== */
const CFG={databaseURL:"https://school-3-online-edu-default-rtdb.europe-west1.firebasedatabase.app"};
/* ================================================================ */
const $app=document.getElementById('app');
const el=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
const clear=()=>{$app.textContent=''};
const TPL={h:'<h1>Привіт, світе!</h1>\n<button id="b">Натисни</button>',c:'body{font-family:sans-serif;text-align:center}\nh1{color:#4f46e5}',j:'document.getElementById("b").onclick=()=>{\n  console.log("Клік!");\n};'};
const build=(h,c,j)=>`<!doctype html><html><head><meta charset="utf-8"><style>${c}</style></head><body>${h}<script>(function(){const s=(t,a)=>parent.postMessage({k:'log',t:t,m:a.map(function(x){try{return typeof x==='object'?JSON.stringify(x):String(x)}catch(e){return String(x)}}).join(' ')},'*');['log','warn','error'].forEach(function(t){const o=console[t];console[t]=function(){s(t,[].slice.call(arguments));o.apply(console,arguments)}});addEventListener('error',function(e){s('error',[e.message+' (рядок '+e.lineno+')'])})})();<\/script><script>${j}<\/script></body></html>`;
const frame=()=>{const f=el('iframe',{sandbox:'allow-scripts allow-modals'});return f};
const slug=s=>s.trim().toLowerCase().replace(/[^\p{L}\p{N}]+/gu,'_');
const ago=t=>{if(!t)return'—';const s=(Date.now()-t)/1e3|0;return s<60?s+' с тому':s<3600?(s/60|0)+' хв тому':(s/3600|0)+' год тому'};
let db;

const LS={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const U=c=>c.trim().toUpperCase();
function home(){
  clear();
  if(CFG.databaseURL.includes('ВАШ')){$app.append(el('div',{class:'box'},el('h2',{},'Потрібне налаштування'),el('p',{},'Вставте databaseURL з Firebase у верхній частині index.html (див. інструкцію).')));return}
  if(!db){firebase.initializeApp(CFG);db=firebase.database()}
  location.hash==='#teacher'?homeT():homeS()}
addEventListener('hashchange',()=>location.reload());

function homeS(){
  const code=el('input',{placeholder:'Код заняття (від вчителя)',maxlength:8,style:'text-transform:uppercase',value:U(new URLSearchParams(location.search).get('c')||'')});
  const sel=el('select'),fn=el('input',{placeholder:"Ім'я"}),ln=el('input',{placeholder:'Прізвище'});let off=()=>{};
  const fill=(v,ph)=>{const k=sel.value;sel.textContent='';sel.append(el('option',{value:''},ph));Object.keys(v).sort((a,b)=>v[a].name.localeCompare(v[b].name,'uk',{numeric:true})).forEach(i=>sel.append(el('option',{value:i},v[i].name)));sel.value=k;if(sel.value!==k)sel.value=''};
  const load=()=>{off();fill({},'— спочатку введіть код —');const c=U(code.value);if(c.length<3)return;
    const r=db.ref('rooms/'+c+'/classes'),f=s=>{const v=s.val()||{};fill(v,Object.keys(v).length?'— оберіть клас —':'Класів поки немає')};r.on('value',f);off=()=>r.off('value',f)};
  code.oninput=load;load();
  const go=async()=>{const c=U(code.value);if(!c||!fn.value.trim()||!ln.value.trim()||!sel.value)return alert("Заповніть код, ім'я, прізвище та оберіть клас");
    const ex=await db.ref('rooms/'+c+'/meta').once('value');if(!ex.exists())return alert('Заняття з таким кодом не знайдено');
    off();student(c,fn.value.trim(),ln.value.trim(),sel.value,sel.selectedOptions[0].textContent)};
  $app.append(el('div',{class:'box'},el('h2',{style:'margin:0'},'💻 Клас-код'),code,sel,fn,ln,el('button',{onclick:go},'Підключитися'),
    el('div',{class:'mu'},"Той самий код + те саме ім'я й прізвище повертають вашу роботу після перезавантаження.")))}

function homeT(){
  const code=el('input',{placeholder:'Код заняття (порожньо — створити новий)',maxlength:8,style:'text-transform:uppercase',value:LS.g('kk-code')||''});
  const pin=el('input',{placeholder:'PIN вчителя',type:'password',onkeydown:e=>{if(e.key==='Enter')go()}});
  const go=async()=>{let c=U(code.value);const p=pin.value.trim();if(!p)return alert('Введіть PIN');if(!c)c=Math.random().toString(36).slice(2,7).toUpperCase();
    const r=db.ref('rooms/'+c+'/meta'),s=await r.once('value');
    if(s.exists()){if(s.val().pin!==p)return alert('Невірний PIN')}else await r.set({pin:p,task:'',created:Date.now()});
    LS.s('kk-code',c);teacher(c)};
  $app.append(el('div',{class:'box'},el('h2',{style:'margin:0'},'🧑‍🏫 Кабінет вчителя'),code,pin,el('button',{onclick:go},'Увійти'),
    el('div',{class:'mu'},'Новий PIN створює нове заняття. Для наявного заняття введіть його код і той самий PIN.')))}

function student(code,fn,ln,cid,cname){
  const id=slug(fn+' '+ln),ref=db.ref('rooms/'+code+'/students/'+id),conn=db.ref('.info/connected'),tref=db.ref('rooms/'+code+'/meta/task');
  let S={...TPL},tab='h',timer,logs=[];
  clear();
  const status=el('span',{class:'mu'},'…'),task=el('div',{class:'banner',style:'display:none'}),cm=el('div',{class:'banner cm',style:'display:none'});
  const ta=el('textarea',{class:'code',spellcheck:'false'}),pv=frame(),con=el('div',{class:'con'});
  const tabs=el('div',{class:'tabs'},['h:HTML','c:CSS','j:JavaScript'].map(x=>{const[k,n]=x.split(':');return el('button',{class:'g','data-k':k,onclick:()=>{S[tab]=ta.value;tab=k;ta.value=S[k];mark()}},n)}));
  const mark=()=>[...tabs.children].forEach(b=>b.className=b.dataset.k===tab?'on':'g');
  const run=()=>{logs=[];con.textContent='';pv.srcdoc=build(S.h,S.c,S.j)};
  const meta=()=>({n:fn+' '+ln,cls:cid,cn:cname});
  const save=()=>{status.textContent='зберігаю…';ref.update({...S,...meta(),upd:Date.now()}).then(()=>status.textContent='✓ збережено')};
  ta.oninput=()=>{S[tab]=ta.value;clearTimeout(timer);timer=setTimeout(()=>{run();save()},700)};
  ta.onkeydown=e=>{if(e.key==='Tab'){e.preventDefault();ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');ta.oninput()}};
  const onMsg=e=>{if(e.source!==pv.contentWindow||!e.data||e.data.k!=='log')return;con.append(el('div',{class:e.data.t},'› '+e.data.m));con.scrollTop=1e9};
  addEventListener('message',onMsg);
  const leave=()=>{clearTimeout(timer);S[tab]=ta.value;conn.off();tref.off();ref.child('comment').off();removeEventListener('message',onMsg);
    ref.child('on').onDisconnect().cancel();ref.update({...S,...meta(),upd:Date.now(),on:false});home()};
  $app.append(el('header',{},el('b',{},'👤 '+fn+' '+ln),el('span',{class:'mu'},'🏫 '+cname+' · код '+code),status,el('button',{class:'g',onclick:leave},'Вийти')),task,cm,
    el('div',{class:'ws'},el('div',{class:'pane'},tabs,ta),el('div',{class:'pane'},pv,con)));
  ref.once('value').then(s=>{const v=s.val();if(v)S={h:v.h??TPL.h,c:v.c??TPL.c,j:v.j??TPL.j};ta.value=S[tab];mark();run();
    ref.update({...S,...meta(),upd:v?.upd||Date.now()});
    conn.on('value',c=>{if(c.val()){ref.child('on').onDisconnect().set(false);ref.child('on').set(true)}})});
  tref.on('value',s=>{const t=s.val();task.style.display=t?'':'none';task.textContent=t?'📝 Завдання:\n'+t:''});
  ref.child('comment').on('value',s=>{const t=s.val();cm.style.display=t?'':'none';cm.textContent=t?'💬 Вчитель: '+t:''});
}

function teacher(code){
  clear();const base=db.ref('rooms/'+code),meta=base.child('meta'),sts=base.child('students'),cls=base.child('classes');
  let data={},classes={},open=null,cards={},cur='all';
  const link=location.href.split(/[?#]/)[0]+'?c='+code;
  const grid=el('div',{class:'grid'}),chips=el('div',{class:'chips'}),empty=el('div',{class:'mu',style:'padding:0 16px 16px'},'Поки що немає підключених учнів.');
  const tk=el('textarea',{rows:3,placeholder:'Текст завдання для всіх учнів…'}),lk=el('input',{readonly:'',value:link,onclick:e=>e.target.select()});
  meta.child('task').once('value').then(s=>tk.value=s.val()||'');
  const cname=k=>(classes[k]&&classes[k].name)||'';
  const online=()=>Object.keys(data).filter(i=>data[i].on&&data[i].n);
  const vis=i=>cur==='all'||data[i].cls===cur;
  const apply=()=>{let n=0;Object.keys(cards).forEach(i=>{const v=vis(i);cards[i].e.style.display=v?'':'none';if(v)n++});empty.style.display=n?'none':''};
  const addClass=()=>{const n=prompt('Назва класу (напр. 9-А):');if(n&&n.trim())cls.push({name:n.trim()})};
  const delClass=()=>{if(confirm('Видалити клас «'+cname(cur)+'»? Роботи учнів залишаться.')){cls.child(cur).remove()}};
  const drawChips=()=>{chips.textContent='';const ids=online();
    const mk=(k,t,n)=>el('button',{class:cur===k?'on':'g',onclick:()=>{cur=k;drawChips();apply()}},t,el('span',{class:'cnt'},String(n)));
    chips.append(mk('all','Усі',ids.length));
    Object.keys(classes).sort((a,b)=>classes[a].name.localeCompare(classes[b].name,'uk',{numeric:true})).forEach(k=>chips.append(mk(k,'🏫 '+classes[k].name,ids.filter(i=>data[i].cls===k).length)));
    chips.append(el('button',{class:'g',onclick:addClass},'＋ Додати клас'));
    if(cur!=='all')chips.append(el('button',{class:'g',onclick:delClass},'🗑 Видалити клас'))};
  const modal=el('div',{class:'modal',style:'display:none'});
  const detail=()=>{const d=data[open];if(!d){modal.style.display='none';modal.dataset.id='';return}
    modal.style.display='flex';
    if(modal.dataset.id!==open){modal.dataset.id=open;modal.textContent='';
      const p=frame(),ta=el('textarea',{class:'code',readonly:'',spellcheck:'false'}),cm=el('input',{placeholder:"Коментар учневі (з'явиться в нього одразу)",value:d.comment||''});let tab='h';
      const tabs=el('div',{class:'tabs'},['h:HTML','c:CSS','j:JS'].map(x=>{const[k,n]=x.split(':');return el('button',{class:k==='h'?'on':'g','data-k':k,onclick:()=>{tab=k;[...tabs.children].forEach(b=>b.className=b.dataset.k===k?'on':'g');ta.value=data[open][k]||''}},n)}));
      modal._p=p;modal._t=ta;modal._k=()=>tab;
      modal.append(el('div',{},el('header',{},el('b',{},d.n+(cname(d.cls)?' · '+cname(d.cls):'')),el('button',{class:'g',onclick:()=>{open=null;detail()}},'✕ Закрити')),
        el('div',{class:'tp'},el('div',{class:'row'},cm,el('button',{style:'flex:0',onclick:()=>sts.child(open+'/comment').set(cm.value)},'Надіслати'))),
        el('div',{class:'ws',style:'flex:1;height:auto'},el('div',{class:'pane'},tabs,ta),el('div',{class:'pane'},p))))}
    if(modal._u!==d.upd){modal._u=d.upd;modal._t.value=d[modal._k()]||'';modal._p.srcdoc=build(d.h||'',d.c||'',d.j||'')}};
  const render=()=>{const ids=online().sort((a,b)=>data[a].n.localeCompare(data[b].n,'uk'));
    Object.keys(cards).forEach(i=>{if(!ids.includes(i)){cards[i].e.remove();delete cards[i]}});
    ids.forEach(i=>{const d=data[i];let c=cards[i];
      if(!c){const nm=el('span',{style:'flex:1'}),tm=el('span',{class:'mu'}),th=el('div',{class:'th'},frame());
        c=cards[i]={e:el('div',{class:'st',onclick:()=>{open=i;modal.dataset.id='';modal._u=null;detail()}},el('h4',{},el('span',{class:'dot o'}),nm,tm),th),nm,tm,f:th.firstChild}}
      c.nm.textContent=d.n+(cname(d.cls)?' · '+cname(d.cls):'');c.tm.textContent=ago(d.upd);
      if(c.u!==d.upd){c.u=d.upd;c.f.srcdoc=build(d.h||'',d.c||'',d.j||'')}
      grid.append(c.e)});
    drawChips();apply();if(open&&!(data[open]&&data[open].on&&data[open].n))open=null;detail()};
  $app.append(el('header',{},el('b',{},'🧑‍🏫 Кабінет · код '+code),
      el('button',{class:'g',onclick:()=>{const b=new Blob([JSON.stringify({classes,students:data},null,1)],{type:'application/json'});el('a',{href:URL.createObjectURL(b),download:'роботи_'+code+'.json'}).click()}},'⬇ Усі роботи (JSON)'),
      el('button',{class:'g',onclick:()=>{home();location.reload()}},'Вийти')),
    el('div',{class:'tp'},el('div',{class:'mu'},'Посилання для учнів (код підставиться сам):'),lk,tk,
      el('div',{class:'row'},el('button',{onclick:()=>meta.child('task').set(tk.value).then(()=>alert('Завдання надіслано'))},'Надіслати завдання учням'))),
    chips,grid,empty,modal);
  sts.on('value',s=>{data=s.val()||{};render()});
  cls.on('value',s=>{classes=s.val()||{};if(cur!=='all'&&!classes[cur])cur='all';render()});
  setInterval(()=>Object.keys(cards).forEach(i=>data[i]&&(cards[i].tm.textContent=ago(data[i].upd))),15000);
}
home();
</script></body></html>
